name: Terraform CI & CD

on:
  push:
      paths-ignore:
      - '**/README.md'

permissions:
  id-token: write
  contents: read   

jobs:

  scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
        - name: Checkout Repo
          uses: actions/checkout@v7  
          with:
            fetch-depth: 0

        - name: Gitleaks Scanning
          uses: gitleaks/gitleaks-action@v3
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}    

        - name: TruffleHog OSS
          uses: trufflesecurity/trufflehog@v3.96.0
          with:
            extra_args: --results=verified,unknown --json >> trufflehog-report.json

        - uses: terraform-linters/setup-tflint@v6
          name: Setup TFLint
          with:
            tflint_version: v0.52.0
            cache: true

        - name: Show version
          run: tflint --version

        - name: Init TFLint
          run: tflint --init
          env:
            GITHUB_TOKEN: ${{ github.token }}

        - name: Run TFLint
          run: tflint -f compact >> tflint-report.txt

        - name: Upload Scan Reports
          if: always()
          uses: actions/upload-artifact@v7
          with:
            name: scan-reports
            path: |
              trufflehog-report.json
              tflint-report.txt
            retention-days: 5


  plan:
      name: Terraform Plan
      needs: scan
      runs-on: ubuntu-latest
      environment:
        name: development
      defaults:
        run:
            working-directory: environment/dev

      outputs:
        changes: ${{ steps.planid.outputs.changes }}
        status: ${{ steps.planid.outputs.status}}

      steps:

        - name: Checkout Repo
          uses: actions/checkout@v7
        
        - name: Azure login
          uses: azure/login@v3
          with:
            client-id: ${{ secrets.AZURE_CLIENT_ID }}
            tenant-id: ${{ secrets.AZURE_TENANT_ID }}
            subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

        - uses: hashicorp/setup-terraform@v4
          with:
            terraform_version: "1.14.6"

        - name: Terraform fmt
          run: terraform fmt -check
          continue-on-error: true

        - name: Terraform Init
          run: terraform init

        - name: Terraform Validate
          run: terraform validate

        - name: Terraform Plan
          id: planid
          run: |
            set +e
            terraform plan -detailed-exitcode -out=tfplan

            EXIT_CODE=$?

            if [ "$EXIT_CODE" -eq 0 ]; then
              echo "status=success" >> "$GITHUB_OUTPUT"
              echo "changes=false" >> "$GITHUB_OUTPUT"

            elif [ "$EXIT_CODE" -eq 2 ]; then
              echo "status=success" >> "$GITHUB_OUTPUT"
              echo "changes=true" >> "$GITHUB_OUTPUT"

            else
              echo "status=failed" >> "$GITHUB_OUTPUT"
              echo "changes=false" >> "$GITHUB_OUTPUT"
              exit "$EXIT_CODE"
            fi
          
        - name: Upload Plan Artifact
          uses: actions/upload-artifact@v7
          with:
            name: terraform-plan
            path: tfplan

  apply:
      name: Terraform Apply
      needs: plan
      if: github.ref == 'refs/heads/main' && needs.plan.outputs.changes == 'true' && needs.plan.outputs.status == 'success'
      runs-on: ubuntu-latest
      environment:
        name: production 
      defaults:
        run:
            working-directory: environment/dev

      steps:

        - name: Checkout Repo
          uses: actions/checkout@v7
        
        - name: Azure login
          uses: azure/login@v3
          with:
            client-id: ${{ secrets.AZURE_CLIENT_ID }}
            tenant-id: ${{ secrets.AZURE_TENANT_ID }}
            subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

        - uses: hashicorp/setup-terraform@v4
          with:
            terraform_version: "1.14.6"

        - name: Terraform fmt
          run: terraform fmt -check
          continue-on-error: true

        - name: Terraform Init
          run: terraform init

        - name: Download Plan Artifact
          uses: actions/download-artifact@v8
          with:
            name: terraform-plan
            path: tfplan
          
        - name: Terraform Apply
          run: terraform apply -auto-approve tfplan








